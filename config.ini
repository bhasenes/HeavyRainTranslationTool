; Heavy Rain Translation Tool - settings

[Game]
; HEAVY RAIN game folder. Leave empty to find it automatically (Steam).
; Example: Folder = D:\SteamLibrary\steamapps\common\HEAVY RAIN
Folder =

[Subtitles]
; Longest subtitle line in characters (54-300). 108 is about 80% of the screen width.
MaxLineLength = 108
; Words followed by a period that do NOT end a sentence (lowercase, comma separated).
Abbreviations = dr, mr, mrs, ms, st, jr, sr, prof, no, vs
; Words a very long sentence may be split before (lowercase, comma separated).
Conjunctions = but, and, or

[Fonts]
; The special letters of your language, e.g. RequiredCharacters = ąćęłńóśźżĄĆĘŁŃÓŚŹŻ
; 2_Extract_Fonts.bat then lists which of them each font is missing.
RequiredCharacters =

[ARI]
; ARI screens can only show Latin-1 characters. For other letters, draw the letter over an
; unused Latin-1 box in ARI_FONT and map it here (letter=box, comma separated).
; Example: CharacterMap = ł=ì, Ł=Ì
CharacterMap =
